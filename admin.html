<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProtoLab · Admin inbox</title>
  <style>
    :root{--paper:#f5f3ec;--white:#fffefa;--ink:#17211d;--muted:#594735;--line:#dedbd1;--green:#dff3bd}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}.shell{width:min(1040px,calc(100% - 32px));margin:auto}.top{padding:24px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:750;letter-spacing:-.06em;color:inherit;text-decoration:none}.brand span{display:inline-grid;place-items:center;background:var(--green);width:30px;height:30px;border-radius:8px;margin-right:8px}.wrap{padding:38px 0 70px}h1{font-size:clamp(28px,4vw,40px);line-height:1.05;letter-spacing:-.06em;margin:0 0 8px}.intro{color:var(--muted);margin:0 0 24px}.panel,.request{background:var(--white);border:1px solid var(--line);border-radius:7px;padding:22px}.panel{max-width:460px}.field{display:grid;gap:6px;margin:14px 0;color:#59402b;font-size:12px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:4px;padding:10px;background:#fff;color:var(--ink);font:inherit}.field textarea{min-height:90px}.btn{border:1px solid var(--ink);border-radius:4px;background:var(--ink);color:white;padding:10px 14px;font-weight:650;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.quiet{background:transparent;color:var(--ink)}.status{min-height:24px;color:#59402b;font-size:13px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 14px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:4px;padding:9px;background:var(--white);font:inherit;color:var(--ink)}.toolbar input{min-width:180px;flex:1}.list{display:grid;gap:14px}.request-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.request h2{font-size:19px;margin:0}.meta{font-size:12px;color:#594735}.badge{background:var(--green);border-radius:99px;padding:4px 9px;font-size:11px}.description{white-space:pre-wrap;margin:14px 0;color:#32291f}.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:24px;border:1px dashed #b7b5a9;border-radius:6px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:620px){.wrap{padding-top:28px}.panel,.request{padding:17px}.admin-grid{grid-template-columns:1fr}.request-head{display:block}.badge{display:inline-block;margin-top:8px}.toolbar{flex-wrap:wrap;justify-content:flex-start}.toolbar strong{width:100%}.toolbar input{flex-basis:100%}}
  </style>
<style>
body{font-size:16px}
.intro{font-size:16px;line-height:1.6}
.field{font-size:14px;font-weight:600}
.status,.meta{font-size:14px;line-height:1.55}
.request h2{font-size:21px;font-weight:700}
.description{font-size:15px;line-height:1.65}
.badge{font-size:12px;font-weight:700}
.btn,.toolbar input,.toolbar select{font-size:14px;font-weight:600}
</style>
</head>
<body>
  <header class="top shell"><a class="brand" href="index.html"><span>⌁</span>protolab <small style="font-size:10px;color:#6a523c">ADMIN</small></a><button class="btn quiet" id="signOut" hidden>Sign out</button></header>
  <main class="shell wrap"><h1>Request inbox</h1><p class="intro">Review part and project requests, prepare estimates, and reply to customers.</p>
    <section class="panel" id="loginPanel"><form id="loginForm"><label class="field">Admin email<input name="email" type="email" autocomplete="username" required></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn" id="loginButton">Sign in</button><p class="status" id="loginStatus" aria-live="polite"></p></form></section>
    <section id="inbox" hidden><div class="toolbar"><strong id="count">Requests</strong><input id="searchRequests" type="search" placeholder="Search requests" aria-label="Search requests"><select id="statusFilter" aria-label="Filter by status"><option value="all">All statuses</option><option value="new">New</option><option value="reviewing">Reviewing</option><option value="quoted">Quoted</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="declined">Declined</option></select><button class="btn quiet" id="refreshRequests" type="button">Refresh</button></div><div class="list" id="requestList"></div><p class="status" id="inboxStatus" aria-live="polite"></p></section>
  </main>
<script>
const $=id=>document.getElementById(id),tokenKey='protolabAdminToken';let accessToken=sessionStorage.getItem(tokenKey)||'',requests=[];
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(accessToken?{Authorization:`Bearer ${accessToken}`}:{})}});const body=await response.json().catch(()=>({error:'The server returned an invalid response.'}));if(!response.ok)throw new Error(body.error||'Request failed.');return body}
function showInbox(){ $('loginPanel').hidden=!!accessToken;$('inbox').hidden=!accessToken;$('signOut').hidden=!accessToken;if(accessToken)loadRequests() }
function safe(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function render(){const filter=$('statusFilter').value,query=$('searchRequests').value.trim().toLowerCase();const visible=requests.filter(r=>(filter==='all'||r.status===filter)&&(!query||[r.customer_name,r.customer_email,r.description,r.request_type].some(v=>String(v||'').toLowerCase().includes(query))));$('count').textContent=`${visible.length} of ${requests.length} request${requests.length===1?'':'s'}`;$('requestList').innerHTML=visible.length?visible.map(r=>`<article class="request" data-id="${safe(r.id)}"><div class="request-head"><div><h2>${safe(r.request_type==='part'?'Part request':'Project request')} · ${safe(r.customer_name)}</h2><div class="meta">${safe(r.customer_email)} · ${new Date(r.created_at).toLocaleString()}</div></div><span class="badge">${safe(r.status.replace('_',' '))}</span></div><p class="description">${safe(r.description)}</p><div class="admin-grid"><label class="field">Status<select name="status">${['new','reviewing','quoted','in_progress','completed','declined'].map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${s.replace('_',' ')}</option>`).join('')}</select></label><label class="field">Estimated total (₹)<input name="estimatedTotalInr" type="number" min="0" step="1" value="${r.estimated_total_inr??''}" placeholder="Add estimate"></label><label class="field">Estimated build time<input name="estimatedBuildTime" value="${safe(r.estimated_build_time||'')}" placeholder="e.g. 7–10 working days"></label><label class="field">Message for customer<textarea name="customerMessage" placeholder="Share your estimate, questions, or next steps">${safe(r.customer_message||'')}</textarea></label><label class="field">Private admin notes<textarea name="adminNotes" placeholder="Only visible to admins">${safe(r.admin_notes||'')}</textarea></label></div><div class="actions"><button class="btn quiet save-request">Save changes</button><button class="btn send-quote">Save &amp; email estimate</button></div></article>`).join(''):'<div class="empty">No requests match this filter.</div>';document.querySelectorAll('.request').forEach(card=>{card.querySelector('.save-request').onclick=()=>saveRequest(card,false);card.querySelector('.send-quote').onclick=()=>saveRequest(card,true)})}
async function loadRequests(){ $('inboxStatus').textContent='Loading requests…';try{const result=await api('/api/admin/requests');requests=result.requests||[];render();$('inboxStatus').textContent=''}catch(error){if(error.message.includes('sign in'))logout();$('inboxStatus').textContent=error.message}}
async function saveRequest(card,sendQuote){const buttons=card.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);const get=name=>card.querySelector(`[name="${name}"]`).value;try{const result=await api('/api/admin/requests',{method:'PATCH',body:JSON.stringify({id:card.dataset.id,status:get('status'),estimatedTotalInr:get('estimatedTotalInr'),estimatedBuildTime:get('estimatedBuildTime'),customerMessage:get('customerMessage'),adminNotes:get('adminNotes'),sendQuote})});requests=requests.map(r=>r.id===result.request.id?result.request:r);render();$('inboxStatus').textContent=sendQuote?(result.emailSent?'Estimate saved and emailed to the customer.':'Estimate saved. Email was not sent; configure Resend to enable customer replies.'):'Request changes saved.'}catch(error){$('inboxStatus').textContent=error.message;buttons.forEach(b=>b.disabled=false)}}
function logout(){accessToken='';sessionStorage.removeItem(tokenKey);showInbox()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=$('loginButton');button.disabled=true;$('loginStatus').textContent='Signing in…';try{const data=new FormData(e.currentTarget);const result=await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:data.get('email'),password:data.get('password')})});accessToken=result.accessToken;sessionStorage.setItem(tokenKey,accessToken);showInbox()}catch(error){$('loginStatus').textContent=error.message}finally{button.disabled=false}});
$('signOut').onclick=logout;$('statusFilter').onchange=render;$('searchRequests').oninput=render;$('refreshRequests').onclick=loadRequests;showInbox();
</script>
</body>
</html>
